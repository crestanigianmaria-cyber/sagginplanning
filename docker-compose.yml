services:
  postgres:
    image: postgres:16-alpine
    container_name: saggin-planning-db
    environment:
      POSTGRES_DB: saggin_planning
      POSTGRES_USER: saggin
      POSTGRES_PASSWORD: saggin_dev_2024
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
